[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "net-ping"
version = "0.1.0"
description = "Async ping sweeper with ICMP and TCP fallback"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["ping", "icmp", "networking", "cli", "sweep", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
    "Topic :: Utilities",
]
dependencies = [
    "icmplib>=3.0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
net-ping = "net_ping.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/net-ping"
Repository = "https://github.com/YOUR_USERNAME/net-ping"
Issues = "https://github.com/YOUR_USERNAME/net-ping/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/net_ping"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/net_ping"]